<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeLoom · Run inspector</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1014;color:#d5dde3;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}h1,h2{font-family:ui-monospace,monospace}h1{font-size:28px}h2{font-size:18px;margin-top:32px}a{color:#7eb5d0}p,small{color:#9ba6af}select,button{min-height:44px;border:1px solid #ffffff26;background:#13191f;color:#d5dde3;padding:8px 12px}a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #ff5c33;outline-offset:3px}details{border-bottom:1px solid #ffffff26;padding:8px 0}summary{cursor:pointer;min-height:44px;padding:10px 0;font:13px/1.6 ui-monospace,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#ffffff05;padding:16px}#filters{display:flex;gap:16px;flex-wrap:wrap}#status{border-left:2px solid #ff5c33;padding:16px;background:#ffffff05}.agent{padding:12px 0;border-bottom:1px solid #ffffff26}.agent small{display:block}@media(max-width:600px){main{padding:24px 16px}h1{font-size:22px}}</style>
<main><a href="/">← Live benchmark monitor</a><h1 id="title">Loading sealed recording…</h1><p id="status" role="status"></p><p id="downloads"></p><h2>Agent relationships</h2><div id="agents"></div><h2>Provider requests</h2><div id="requests"></div><h2>Timeline</h2><div id="filters"><label>Event type <select id="kind"><option value="all">All events</option></select></label><label>Agent <select id="agent"><option value="all">All agents</option></select></label></div><div id="events"></div><h2>Submitted patch</h2><pre id="patch"></pre><h2>Grading</h2><pre id="grading"></pre></main>
<script>
const $=id=>document.getElementById(id);let recording;function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function detail(parent,title,value){const d=element('details','');d.append(element('summary',title));d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('pre'))d.append(element('pre',typeof value==='string'?value:JSON.stringify(value,null,2)))});parent.append(d)}function events(){const rows=(recording.timeline||[]).filter(e=>($('kind').value==='all'||e.kind===$('kind').value)&&($('agent').value==='all'||e.agent_id===$('agent').value));$('events').replaceChildren();for(const e of rows)detail($('events'),`${e.kind} · ${e.agent_id||'root'} · ${e.title}`,e);if(!rows.length)$('events').append(element('p','No matching events.'))}
async function load(){const view=new URLSearchParams(location.search).get('view');if(!view||!view.startsWith('/benchmarks/')||!view.endsWith('/view.json')||view.includes('..'))throw Error('Invalid recording path');const response=await fetch(view);if(!response.ok)throw Error('Recording unavailable or not sealed yet');recording=await response.json();const r=recording;$('title').textContent=`${r.task_id} · ${r.system}`;$('status').textContent=`${r.stage} · ${r.synthetic?'Synthetic check, not scored':r.passed?'Passed':r.termination} · ${typeof r.cost_usd==='number'?'$'+r.cost_usd.toFixed(6):'Cost unavailable'} · ${typeof r.elapsed_s==='number'?Math.round(r.elapsed_s)+' seconds':'Time unavailable'}`;const base=view.slice(0,-'view.json'.length);for(const [name,label] of [['view.json','Recording JSON'],['patch.diff','Submitted patch'],['verification.json','Grader output']]){const a=element('a',label+' ↗');a.href=base+name;$('downloads').append(a,document.createTextNode(' · '))}for(const a of r.agents||[]){const d=element('div',`${a.profile} · ${a.id}`);d.className='agent';d.append(element('small',`Parent: ${a.parent_id||'none'} · ${a.status} · ${a.tool_calls||0} tools`));$('agents').append(d);const o=element('option',a.profile+' · '+a.id);o.value=a.id;$('agent').append(o)}for(const [i,q] of (r.requests||[]).entries())detail($('requests'),`Request ${i+1} · ${q.status||'recorded'}`,q);for(const k of new Set((r.timeline||[]).map(e=>e.kind))){const o=element('option',k);o.value=k;$('kind').append(o)}$('patch').textContent=typeof r.patch==='string'?r.patch:JSON.stringify(r.patch,null,2);$('grading').textContent=JSON.stringify(r.grading??r.checks,null,2);events()}
$('kind').onchange=events;$('agent').onchange=events;load().catch(e=>{$('status').textContent=e.message});
</script></html>
