[project]
name = "codeloom-benchmark"
version = "0.2.0"
description = "Local paired benchmark of mini-SWE-agent and CodeLoom Engine"
requires-python = ">=3.12"
dependencies = ["requests==2.32.5", "jsonschema==4.25.1", "PyYAML==6.0.3", "mini-swe-agent==2.4.6"]

[project.scripts]
harness = "harness.cli:main"
codeloom-benchmark = "harness.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
