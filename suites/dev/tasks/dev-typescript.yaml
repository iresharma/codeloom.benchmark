id: dev-typescript
repo: pqueue
upstream: https://github.com/sindresorhus/p-queue.git
commit: 7f272ab5ff2254c0dc2537b7977e88ede1cd55e8
category: cross-file
language: typescript
title: Detached queued-ID snapshots
prompt: Add Queue.pendingIds():readonly string[], PriorityQueue.pendingIds() and PQueue.pendingIds():readonly
  string[]. Return IDs for queued tasks in execution order, excluding started/removed tasks. Return a
  detached snapshot that cannot change the queue. Reordering/clearing/dequeuing must be reflected in future
  snapshots. Preserve existing test behavior and leave the main checkout ready for grading. Make the Queue
  capability optional for existing custom queues; PQueue.pendingIds throws TypeError when a custom queue
  does not support it.
allowed_paths:
- source/*.ts
- test/*.ts
- benchmark_tests/*
verification:
- npm run build
- node --import=tsx/esm --test --test-timeout=60000 test/*.ts
provenance: cross-file
setup:
  test/strict.ts:
  - old: test('strict mode multiple complete intervals', async () => {
    new: "test('strict mode multiple complete intervals', async t => {\n\tt.mock.timers.enable({apis: ['setTimeout',\
      \ 'setInterval', 'Date'], now: 1_000_000});"
    count: 1
  - old: "\tawait queue.onIdle();\n\n\tassert.equal(executionTimes.length, 12);"
    new: "\tawait flush();\n\tassert.equal(executionTimes.length, 3);\n\n\t// Advance to each boundary,\
      \ proving no task starts before its slot.\n\tfor (let window = 0; window < 3; window++) {\n\t\tawait\
      \ tick(t, 99);\n\t\tassert.equal(executionTimes.length, (window + 1) * 3);\n\t\tawait tick(t, 1);\n\
      \t\tassert.equal(executionTimes.length, (window + 2) * 3);\n\t}\n\n\tawait queue.onIdle();\n\n\tassert.equal(executionTimes.length,\
      \ 12);"
    count: 1
reference:
  source/queue.ts:
  - old: "\tsize: number;"
    new: "\tpendingIds?: () => readonly string[];\n\tsize: number;"
  source/priority-queue.ts:
  - old: "\tenqueue(run: RunFunction,"
    new: "\tpendingIds(): readonly string[] {\n\t\treturn this.#queue.slice(this.#head).filter(item =>\
      \ item?.id !== undefined).map(item => item!.id!);\n\t}\n\n\tenqueue(run: RunFunction,"
  source/index.ts:
  - old: "\tsetPriority(id: string, priority: number) {"
    new: "\tpendingIds(): readonly string[] { if (!this.#queue.pendingIds) { throw new TypeError('queue\
      \ does not support pending IDs'); } return [...this.#queue.pendingIds()]; }\n\n\tsetPriority(id:\
      \ string, priority: number) {"
mutants: []
certification:
  status: pending
  reason: Reference/no-op, regression and mutant checks have not run.
