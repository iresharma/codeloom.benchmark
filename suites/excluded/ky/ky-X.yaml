title: Safe HTTP error header summaries
prompt: 'Add errorHeaderRedaction?: readonly string[] to Ky options and the option registry. Add readonly
  requestHeaderSummary: Record<string,string> on HTTPError. It snapshots error.request.headers, redacting
  Authorization and Cookie by default plus specified names case-insensitively to [REDACTED]. Preserve
  unlisted headers. Redaction must not mutate the actual request or its headers; error.options retains
  normalized options. Keep existing error behavior and exports.


  Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree. You
  may edit production source and add tests under benchmark_tests/, but existing tests/configuration and
  .bench files are immutable.'
allowed_paths:
- source/**/*.ts
- source/*.ts
- benchmark_tests/*
verification:
- npm run build
- ./node_modules/.bin/tsc --project tsconfig.test.json
- ./node_modules/.bin/ava --timeout=2m --concurrency=2
provenance: cross-file
setup: {}
