category: cross-file
language: go
title: Per-route request body size limit middleware
prompt: 'Add a new middleware to chi, `middleware.MaxBytes(limit int64)`, that wraps the request body in `http.MaxBytesReader` so handlers reading past `limit` bytes get an error. It must be settable per-route (different routes in the same mux can have different limits) via chi''s existing route-chaining mechanism (e.g. `Router.With`), not only globally for the whole mux. Add a Go doc comment and tests covering: under-limit reads succeed, over-limit reads fail, and two routes with different limits behave independently. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
