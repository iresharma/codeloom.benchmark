    new: " b.Loop() {\n\t\t\t\tmx.ServeHTTP(w, r)\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc TestMuxTag(t *testing.T) {\n\th := func(w http.ResponseWriter, r *http.Request) {\n\t\tw.WriteHeader(200)\n\t}\n\n\tr := NewRouter()\n\tr.With(Tag(\"auth-required\"), Tag(\"admin\")).Get(\"/admin\", h)\n\tr.With(Tag(\"public\")).Post(\"/signup\", h)\n\tr.Get(\"/no-tags\", h)\n\n\tbyPattern := map[string][]string{}\n\tfor _, rt := range r.RoutesWithTags() {\n\t\tif rt.Method == \"GET\" && rt.Pattern == \"/admin\" {\n\t\t\tbyPattern[\"GET /admin\"] = rt.Tags\n\t\t}\n\t\tif rt.Method == \"POST\" && rt.Pattern == \"/signup\" {\n\t\t\tbyPattern[\"POST /signup\"] = rt.Tags\n\t\t}\n\t\tif rt.Method == \"GET\" && rt.Pattern == \"/no-tags\" {\n\t\t\tbyPattern[\"GET /no-tags\"] = rt.Tags\n\t\t}\n\t}\n\n\tif got := byPattern[\"GET /admin\"]; len(got) != 2 || got[0] != \"auth-required\" || got[1] != \"admin\" {\n\t\tt.Fatalf(\"expected [auth-required admin] tags on GET /admin, got %v\", got)\n\t}\n\tif got := byPattern[\"POST /signup\"]; len(got) != 1 || got[0] != \"public\" {\n\t\tt.Fatalf(\"expected [public] tag on POST /signup, got %v\", got)\n\t}\n\tif got := byPattern[\"GET /no-tags\"]; len(got) != 0 {\n\t\tt.Fatalf(\"expected no tags on GET /no-tags, got %v\", got)\n\t}\n\n\t// Tag() must remain a transparent pass-through middleware: requests\n\t// still reach the underlying handler normally.\n\treq := httptest.NewRequest(http.MethodGet, \"/admin\", nil)\n\trr := httptest.NewRecorder()\n\tr.ServeHTTP(rr, req)\n\tif rr.Code != 200 {\n\t\tt.Fatalf(\"expected status 200 from tagged route, got %d\", rr.Code)\n\t}\n}\n\nfunc TestMuxTagMountedSubrouter(t *testing.T) {\n\th := func(w http.ResponseWriter, r *http.Request) {\n\t\tw.WriteHeader(200)\n\t}\n\n\tsub := NewRouter()\n\tsub.With(Tag(\"sub-tag\")).Get(\"/thing\", h)\n\n\tr := NewRouter()\n\tr.Mount(\"/api\", sub)\n\n\tvar tags []string\n\tfor _, rt := range r.RoutesWithTags() {\n\t\tif rt.Method == \"GET\" && rt.Pattern == \"/api/thing\" {\n\t\t\ttags = rt.Tags\n\t\t}\n\t}\n\n\tif len(tags) != 1 || tags[0] != \"sub-tag\" {\n\t\tt.Fatalf(\"expected [sub-tag] tag on mounted route, got %v\", tags)\n\t}\n}\n"
