language: go
title: Route tagging metadata for tooling
prompt: Add route metadata/tagging to chi so later tooling (e.g. OpenAPI generation) can consume it. Routes must be able to carry arbitrary string tags at registration time, using an API consistent with chi's existing middleware-chaining style (for example `r.With(chi.Tag("auth-required")).Get(...)`, or another idiomatic approach of your choosing). Add `Mux.RoutesWithTags()` (or an equivalently-named method) that walks the route tree, including mounted sub-routers, and returns each route's method, pattern, and its tags. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.
