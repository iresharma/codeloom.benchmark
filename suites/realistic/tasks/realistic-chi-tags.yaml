      '
    new: "ndler's.\ntype Middlewares []func(http.Handler) http.Handler\n\n// Tag returns a middleware that attaches the given tags to the route(s) it\n// is applied to, as metadata for tooling (e.g. OpenAPI generation) to\n// consume later via Mux.RoutesWithTags. It is a transparent, pass-through\n// middleware: it never alters request handling.\n//\n// Tags are typically scoped to a subset of routes using With(), the same\n// way any other chi middleware is scoped to a subset of routes:\n//\n//\tr.With(chi.Tag(\"auth-required\")).Get(\"/admin\", adminHandler)\nfunc Tag(tags ...string) func(http.Handler) http.Handler {\n\treturn func(next http.Handler) http.Handler {\n\t\treturn &tagHandler{next: next, tags: tags}\n\t}\n}\n\n// tagHandler is a transparent http.Handler wrapper carrying the tags passed\n// to Tag(). It forwards every request to next unchanged; the tags are only\n// ever read back out-of-band, by RoutesWithTags.\ntype tagHandler struct {\n\tnext http.Handler\n\ttags []string\n}\n\nfunc (t *tagHandler) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n\tt.next.ServeHTTP(w, r)\n}\n\n// Tags returns the tags attached via Tag().\nfunc (t *tagHandler) Tags() []string {\n\treturn t.tags\n}\n\n// tagged is implemented by tagHandler, allowing RoutesWithTags to recognize\n// a Tag() middleware among an arbitrary middleware stack without depending\n// on its concrete type.\ntype tagged interface {\n\tTags() []string\n}\n"
  mux.go:
  - old: "s of a router.\nfunc (mx *Mux) Routes() []Route {\n\treturn mx.tree.routes()\n}\n\n// "
    new: "s of a router.\nfunc (mx *Mux) Routes() []Route {\n\treturn mx.tree.routes()\n}\n\n// RouteTags describes a single registered route (method + pattern) along\n// with any tags attached to it via Tag(), for tooling that needs route\n// metadata, such as generating OpenAPI documentation.\ntype RouteTags struct {\n\tMethod  string\n\tPattern string\n\tTags    []string\n}\n\n// RoutesWithTags walks the full routing tree, including mounted\n// sub-routers, and returns the method, pattern and tags (attached via\n// Tag(), if any) for every registered route. A route with no tags is\n// still included, with a nil Tags slice.\nfunc (mx *Mux) RoutesWithTags() []RouteTags {\n\tvar rts []RouteTags\n\t_ = Walk(mx, func(method, route string, handler http.Handler, middlewares ...func(http.Handler) http.Handler) error {\n\t\tvar tags []string\n\t\tfor _, mw := range middlewares {\n\t\t\twrapped := mw(http.HandlerFunc(func(http.ResponseWriter, *http.Request) {}))\n\t\t\tif tg, ok := wrapped.(tagged); ok {\n\t\t\t\ttags = append(tags, tg.Tags()...)\n\t\t\t}\n\t\t}\n\t\trts = append(rts, RouteTags{Method: method, Pattern: route, Tags: tags})\n\t\treturn nil\n\t})\n\treturn rts\n}\n\n// "
