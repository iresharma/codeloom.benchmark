      @cli.command(name="diff")
      @click.argument("file1", required=True, type=click.Path(exists=True, dir_okay=False))
      @click.argument("file2", required=True, type=click.Path(exists=True, dir_okay=False))
      def diff(file1: str, file2: str) -> None:
          """
          Compare two .env files.

          Prints the keys that were added, removed, and changed between FILE1 and
          FILE2, sorted by key name. Exits with 0 if the files are equivalent and 1
          if they differ.
          """
          with stream_file(file1) as stream1:
              values1 = dotenv_values(stream=stream1)
          with stream_file(file2) as stream2:
              values2 = dotenv_values(stream=stream2)

          keys1 = set(values1)
          keys2 = set(values2)

          added = sorted(keys2 - keys1)
          removed = sorted(keys1 - keys2)
          changed = sorted(key for key in keys1 & keys2 if values1[key] != values2[key])

          for key in added:
              click.echo(f"+ {key}={values2[key]}")
          for key in removed:
              click.echo(f"- {key}={values1[key]}")
          for key in changed:
              click.echo(f"~ {key}: {values1[key]} -> {values2[key]}")

          if added or removed or changed:
              sys.exit(1)


