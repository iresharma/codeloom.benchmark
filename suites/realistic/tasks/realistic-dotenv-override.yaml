title: Add override_files support for layered .env loading
prompt: 'Add override_files support to python-dotenv. Calling load_dotenv(dotenv_path, override_files=[...]) should load the base file first, then apply each file in override_files on top, in the given order: later files'' keys win over earlier files'' keys and over the base file''s keys. Do not change the meaning of the existing, unrelated override flag, which only controls precedence against the process environment. Also add a matching --override-file CLI flag (repeatable, applied in the order given) to the dotenv command. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
