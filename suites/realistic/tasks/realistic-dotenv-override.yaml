          help="Location of an additional .env file to apply on top of the base file. "
          "Can be repeated; later files win over earlier ones and over the base file.",
      )
      @click.version_option(version=__version__)
      @click.pass_context
      def cli(
          ctx: click.Context, file: Any, quote: Any, export: Any, override_files: Any
      ) -> None:
          """This script is used to set, get or unset values from a .env file."""
          if file is not None:
              file = os.path.expanduser(file)
          override_files = tuple(os.path.expanduser(path) for path in override_files)
          ctx.obj = {
              "QUOTE": quote,
              "EXPORT": export,
              "FILE": file,
              "OVERRIDE_FILES": override_files,
          }
