    new: "\tqueue.add(async () => {\n\t\tawait delay(400);\n\t\tresult.push('\U0001F986');\n\t}, {id: '\U0001F986-1'});\n\tqueue.add(async () => {\n\t\tawait delay(400);\n\t\tresult.push('\U0001F986');\n\t}, {id: '\U0001F986-2'});\n\tqueue.add(async () => {\n\t\tawait delay(400);\n\t\tresult.push('\U0001F422');\n\t}, {id: '\U0001F422'});\n\tqueue.add(async () => {\n\t\tawait delay(400);\n\t\tresult.push('\U0001F986');\n\t}, {id: '\U0001F986-3'});\n\tqueue.add(async () => {\n\t\tawait delay(400);\n\t\tresult.push('\U0001F986');\n\t}, {id: '\U0001F986-4'});\n\tqueue.setPriority('\U0001F422', -1);"
  test/basic.ts:
  - old: "\tassert.deepEqual(started, ['first']);\n\tassert.equal(queue.size, 1);\n\tqueue.clear();\n});\n"
    new: "\tassert.deepEqual(started, ['first']);\n\tassert.equal(queue.size, 1);\n\tqueue.clear();\n});\n\ntest('.add() with an `id` already pending returns the existing promise and never calls the new function', async () => {\n\tconst queue = new PQueue({concurrency: 1});\n\tconst calls: string[] = [];\n\n\tconst first = queue.add(async () => {\n\t\tcalls.push('first');\n\t\tawait delay(50);\n\t\treturn 'first-result';\n\t}, {id: 'dedup-key'});\n\n\tassert.equal(queue.size + queue.pending, 1);\n\n\tconst second = queue.add(async () => {\n\t\tcalls.push('second');\n\t\treturn 'second-result';\n\t}, {id: 'dedup-key'});\n\n\t// The duplicate add did not enqueue a new task.\n\tassert.equal(queue.size, 0);\n\tassert.equal(queue.pending, 1);\n\tassert.equal(first, second);\n\n\tassert.equal(await first, 'first-result');\n\tassert.equal(await second, 'first-result');\n\tassert.deepEqual(calls, ['first']);\n});\n\ntest('.add() with an `id` already waiting (not yet running) returns the existing promise', async () => {\n\tconst queue = new PQueue({concurrency: 1});\n\tconst calls: string[] = [];\n\n\t// Occupies the only concurrency slot, so the next add waits.\n\tconst blocker = queue.add(async () => {\n\t\tawait delay(50);\n\t});\n\n\tconst waiting = queue.add(async () => {\n\t\tcalls.push('waiting');\n\t\treturn 'waiting-result';\n\t}, {id: 'dedup-key'});\n\n\tassert.equal(queue.size, 1);\n\n\tconst duplicate = queue.add(async () => {\n\t\tcalls.push('duplicate');\n\t\treturn 'duplicate-result';\n\t}, {id: 'dedup-key'});\n\n\tassert.equal(queue.size, 1);\n\tassert.equal(waiting, duplicate);\n\n\tawait blocker;\n\tassert.equal(await duplicate, 'waiting-result');\n\tassert.deepEqual(calls, ['waiting']);\n});\n\ntest('.add() with an `id` enqueues a fresh task once the earlier one with that id has settled', async () => {\n\tconst queue = new PQueue({concurrency: 1});\n\tconst calls: string[] = [];\n\n\tconst first = queue.add(async () => {\n\t\tcalls.push('first');\n\t\treturn 'first-result';\n\t}, {id: 'dedup-key'});\n\n\tassert.equal(await first, 'first-result');\n\n\tconst second = queue.add(async () => {\n\t\tcalls.push('second');\n\t\treturn 'second-result';\n\t}, {id: 'dedup-key'});\n\n\tassert.notEqual(first, second);\n\tassert.equal(await second, 'second-result');\n\tassert.deepEqual(calls, ['first', 'second']);\n});\n\ntest('.addAll() deduplicates a task that shares an `id` with an already pending task', async () => {\n\tconst queue = new PQueue({concurrency: 1});\n\tconst calls: string[] = [];\n\n\tconst blocker = queue.add(async () => {\n\t\tawait delay(50);\n\t});\n\n\tconst first = queue.add(async () => {\n\t\tcalls.push('first');\n\t\treturn 'first-result';\n\t}, {id: 'shared'});\n\n\tconst allPromise = queue.addAll([\n\t\tasync () => {\n\t\t\tcalls.push('second');\n\t\t\treturn 'second-result';\n\t\t},\n\t], {id: 'shared'});\n\n\tawait blocker;\n\tconst [second] = await allPromise;\n\tawait first;\n\n\tassert.deepEqual(calls, ['first']);\n\tassert.equal(second, 'first-result');\n});\n"
