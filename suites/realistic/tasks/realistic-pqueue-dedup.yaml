language: typescript
title: Deduplicate tasks by id
prompt: Add task deduplication by id to p-queue. If `.add(fn, {id})` is called while a task with that same `id` is already pending or running, it must return that task's existing promise instead of enqueueing a duplicate, and the new function must never be called. Once the original task settles, a later `.add()` call with the same `id` enqueues a fresh task as normal. This must also apply to `.addAll()`. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.
