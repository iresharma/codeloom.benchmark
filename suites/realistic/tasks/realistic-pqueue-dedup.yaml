reference:
  readme.md:
  - old: 'A unique identifier for the task, used to change its priority with `.setPriority()`. Defaults to an incrementing number as a string (`''1''`, `''2''`, and so on), so do not use such strings as your own ids.


      ##### timeout'
    new: 'A unique identifier for the task, used to change its priority with `.setPriority()`. Defaults to an incrementing number as a string (`''1''`, `''2''`, and so on), so do not use such strings as your own ids.


      If a task with this `id` is already pending or running, `.add()` returns its promise instead of enqueueing a duplicate, and the new function is never called. Once that task settles, a later `.add()` call with the same `id` enqueues a fresh task as normal. This also applies to `.addAll()`.


      ##### timeout'
  source/index.ts:
  - old: "\t// Use to assign a unique identifier to a promise function, if not explicitly specified\n\t#idAssigner = 1n;\n\n\t// Track currently running tasks for debugging"
    new: "\t// Use to assign a unique identifier to a promise function, if not explicitly specified\n\t#idAssigner = 1n;\n\n\t// The promise of each task with an explicit `id` that is still pending or running, so that `.add()` can return it instead of enqueueing a duplicate.\n\treadonly #activeTasksById = new Map<string, Promise<unknown>>();\n\n\t// Track currently running tasks for debugging"
  - old: "\tadd<TaskResultType>(function_: Task<TaskResultType>, options: Partial<EnqueueOptionsType> = {}): Promise<Awaited<TaskResultType>> { // eslint-disable-line @typescript-eslint/promise-function-async\n\t\t// Not `async`, so that `.clear()` gets the same promise as the caller and can mark it as handled. An `async` wrapper would return a different promise.\n\t\tconst waitingTask: WaitingTask = {};\n\t\tconst promise = this.#add(function_, options, waitingTask);\n\t\twaitingTask.promise = promise;\n\n\t\t// An `add` event listener can call `.clear()` before the promise exists."
    new: "\tadd<TaskResultType>(function_: Task<TaskResultType>, options: Partial<EnqueueOptionsType> = {}): Promise<Awaited<TaskResultType>> { // eslint-disable-line @typescript-eslint/promise-function-async\n\t\t// A task with this `id` is already pending or running, so return its promise instead of enqueueing a duplicate. The new `function_` is never called.\n\t\tif (options.id !== undefined) {\n\t\t\tconst existingTask = this.#activeTasksById.get(options.id);\n\t\t\tif (existingTask !== undefined) {\n\t\t\t\treturn existingTask as Promise<Awaited<TaskResultType>>;\n\t\t\t}\n\t\t}\n\n\t\t// Not `async`, so that `.clear()` gets the same promise as the caller and can mark it as handled. An `async` wrapper would return a different promise.\n\t\tconst waitingTask: WaitingTask = {};\n\t\tconst promise = this.#add(function_, options, waitingTask);\n\t\twaitingTask.promise = promise;\n\n\t\t// Tracked only for an explicit `id`, so a later duplicate call is deduplicated against it until it settles.\n\t\tif (options.id !== undefined) {\n\t\t\tconst {id} = options;\n\t\t\tthis.#activeTasksById.set(id, promise);\n\t\t\tconst forget = () => {\n\t\t\t\tif (this.#activeTasksById.get(id) === promise) {\n\t\t\t\t\tthis.#activeTasksById.delete(id);\n\t\t\t\t}\n\t\t\t};\n\t\t\tpromise.then(forget, forget);\n\t\t}\n\n\t\t// An `add` event listener can call `.clear()` before the promise exists."
