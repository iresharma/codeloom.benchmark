id: realistic-pqueue-subqueue
repo: pqueue
upstream: https://github.com/sindresorhus/p-queue.git
commit: 7f272ab5ff2254c0dc2537b7977e88ede1cd55e8
category: cross-file
language: typescript
title: Named sub-queues with per-group concurrency
prompt: 'Add named sub-queue support to p-queue. A task added with `queue.add(fn, {group: ''name''})` should additionally be limited by a per-group concurrency cap, independent of the queue''s overall `concurrency`. Configure the caps with a new `groupConcurrency` constructor option (an object mapping group name to its concurrency limit), and add a `queue.setGroupConcurrency(name, limit)` method to change a cap at runtime. A task with no `group`, or whose group has no configured limit, must be unaffected by group concurrency. Two different groups must be able to run concurrently with each other, each only limited by its own cap. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
allowed_paths:
- source/index.ts
- source/options.ts
- source/queue.ts
- source/priority-queue.ts
- test/basic.ts
- test/advanced.ts
- readme.md
verification:
- node --import=tsx/esm --test --test-timeout=60000 test/*.ts
provenance: cross-file
setup: {}
reference:
  source/index.ts:
  - old: "\t// The waiting tasks, so that `.clear()` can reject their promises.\n\treadonly #waitingTasks = new Set<WaitingTask>();\n\n\t#timeout: number | undefined;"
    new: "\t// The waiting tasks, so that `.clear()` can reject their promises.\n\treadonly #waitingTasks = new Set<WaitingTask>();\n\n\t// Per-group concurrency limits, set at construction or via `.setGroupConcurrency()`.\n\treadonly #groupConcurrency = new Map<string, number>();\n\n\t// Tasks currently running in each group, gated against `#groupConcurrency`.\n\treadonly #groupRunning = new Map<string, number>();\n\n\t// Tasks of a saturated group waiting for a slot, in FIFO order.\n\treadonly #groupWaiters = new Map<string, Array<() => void>>();\n\n\t#timeout: number | undefined;"
  - old: "\t\t\tqueueClass = PriorityQueue as unknown as new () => QueueType,\n\t\t\tstrict = false,\n\t\t\ttimeout,\n\t\t} = options ?? {};\n\n\t\tvalidateRateLimit(interval, intervalCap, strict);\n\n\t\tthis.#carryoverIntervalCount = carryoverIntervalCount;"
    new: "\t\t\tqueueClass = PriorityQueue as unknown as new () => QueueType,\n\t\t\tstrict = false,\n\t\t\ttimeout,\n\t\t\tgroupConcurrency = {},\n\t\t} = options ?? {};\n\n\t\tvalidateRateLimit(interval, intervalCap, strict);\n\n\t\tfor (const [group, limit] of Object.entries(groupConcurrency)) {\n\t\t\tvalidateLimit(`groupConcurrency.${group}`, limit);\n\t\t\tthis.#groupConcurrency.set(group, limit);\n\t\t}\n\n\t\tthis.#carryoverIntervalCount = carryoverIntervalCount;"
  - old: "\t#emit(event: EventName, detail?: unknown): void {\n\t\tthis.dispatchEvent(new CustomEvent(event, {detail}));\n\t}"
    new: "\t#emit(event: EventName, detail?: unknown): void {\n\t\tthis.dispatchEvent(new CustomEvent(event, {detail}));\n\t}\n\n\t// Resolves once `group` has a free slot under its configured limit, claiming it. A group with no configured limit resolves at once. Waiting here happens before `#pending++`, so a task blocked on its group does not hold a global concurrency slot, and `#startNextTask` moves on to try other, possibly ungated, waiting tasks instead of blocking behind this one.\n\tasync #acquireGroupSlot(group: string): Promise<void> {\n\t\tif (this.#groupConcurrency.get(group) === undefined) {\n\t\t\treturn;\n\t\t}\n\n\t\tfor (;;) {\n\t\t\t// Read the limit on every iteration, not once before the loop: `.setGroupConcurrency()` can raise it while this call already waits.\n\t\t\tconst limit = this.#groupConcurrency.get(group);\n\t\t\tif (limit === undefined) {\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\tconst running = this.#groupRunning.get(group) ?? 0;\n\t\t\tif (running < limit) {\n\t\t\t\tthis.#groupRunning.set(group, running + 1);\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\tawait new Promise<void>(resolve => {\n\t\t\t\tconst waiters = this.#groupWaiters.get(group) ?? [];\n\t\t\t\twaiters.push(resolve);\n\t\t\t\tthis.#groupWaiters.set(group, waiters);\n\t\t\t});\n\t\t}\n\t}\n\n\t// Frees `group`'s slot and wakes its oldest waiter, if any, to retry for it.\n\t#releaseGroupSlot(group: string): void {\n\t\tconst running = this.#groupRunning.get(group) ?? 0;\n\t\tif (running > 0) {\n\t\t\tthis.#groupRunning.set(group, running - 1);\n\t\t}\n\n\t\tthis.#groupWaiters.get(group)?.shift()?.();\n\t}"
  - old: "\t\t\t\tif (options.signal?.aborted) {\n\t\t\t\t\tthis.#rollbackIntervalConsumption();\n\t\t\t\t\treject(options.signal.reason);\n\t\t\t\t\treturn;\n\t\t\t\t}\n\n\t\t\t\tthis.#pending++;"
    new: "\t\t\t\tif (options.signal?.aborted) {\n\t\t\t\t\tthis.#rollbackIntervalConsumption();\n\t\t\t\t\treject(options.signal.reason);\n\t\t\t\t\treturn;\n\t\t\t\t}\n\n\t\t\t\tif (options.group !== undefined) {\n\t\t\t\t\tawait this.#acquireGroupSlot(options.group);\n\t\t\t\t}\n\n\t\t\t\tthis.#pending++;"
  - old: "\t\t\t\t\t// Remove from running tasks\n\t\t\t\t\tthis.#runningTasks.delete(runningTask);\n\n\t\t\t\t\t// Use queueMicrotask to prevent deep recursion while maintaining timing\n\t\t\t\t\tqueueMicrotask(() => {\n\t\t\t\t\t\tthis.#next();\n\t\t\t\t\t});"
    new: "\t\t\t\t\t// Remove from running tasks\n\t\t\t\t\tthis.#runningTasks.delete(runningTask);\n\n\t\t\t\t\tif (options.group !== undefined) {\n\t\t\t\t\t\tthis.#releaseGroupSlot(options.group);\n\t\t\t\t\t}\n\n\t\t\t\t\t// Use queueMicrotask to prevent deep recursion while maintaining timing\n\t\t\t\t\tqueueMicrotask(() => {\n\t\t\t\t\t\tthis.#next();\n\t\t\t\t\t});"
  - old: "\t\tthrow new ReferenceError(`No promise function with the id \"${id}\" exists in the queue.`);\n\t}\n\n\t/**\n\tAdds a sync or async task to the queue."
    new: "\t\tthrow new ReferenceError(`No promise function with the id \"${id}\" exists in the queue.`);\n\t}\n\n\t/**\n\tChanges the concurrency limit of a named sub-queue (`group`), creating it if it does not already have one. Waking tasks already waiting for that group retry for a slot under the new limit, highest-waiting first.\n\n\t@example\n\t```\n\timport PQueue from 'p-queue';\n\n\tconst queue = new PQueue({groupConcurrency: {slowApi: 1}});\n\n\tqueue.setGroupConcurrency('slowApi', 2);\n\t```\n\t*/\n\tsetGroupConcurrency(group: string, concurrency: number): void {\n\t\tvalidateLimit(`groupConcurrency.${group}`, concurrency);\n\t\tthis.#groupConcurrency.set(group, concurrency);\n\n\t\tconst waiters = this.#groupWaiters.get(group);\n\t\tif (!waiters || waiters.length === 0) {\n\t\t\treturn;\n\t\t}\n\n\t\t// Wake every current waiter so each retries for a slot under the new limit. `#acquireGroupSlot`'s loop re-checks the limit itself, so a waiter that still loses out re-queues behind the others, in order.\n\t\tconst toWake = waiters.splice(0, waiters.length);\n\t\tfor (const resolve of toWake) {\n\t\t\tresolve();\n\t\t}\n\t}\n\n\t/**\n\tAdds a sync or async task to the queue."
  source/options.ts:
  - old: "\tid?: string | undefined;\n\n\t/**\n\tOverride the timeout of the queue for this task. `undefined` means no timeout.\n\n\t@default The `timeout` of the queue\n\t*/\n\ttimeout?: number | undefined;\n} & TaskOptions;"
    new: "\tid?: string | undefined;\n\n\t/**\n\tThe name of a named sub-queue this task belongs to, gated by the `groupConcurrency` option of the queue. A task with no `group`, or whose group has no configured limit, is unaffected by group concurrency.\n\n\t@default undefined\n\t*/\n\tgroup?: string | undefined;\n\n\t/**\n\tOverride the timeout of the queue for this task. `undefined` means no timeout.\n\n\t@default The `timeout` of the queue\n\t*/\n\ttimeout?: number | undefined;\n} & TaskOptions;"
  - old: "\treadonly strict?: boolean | undefined;\n} & TimeoutOptions;"
    new: "\treadonly strict?: boolean | undefined;\n\n\t/**\n\tPer-group concurrency limits for named sub-queues, keyed by group name. A task joins a group with the `group` option of `.add()`. Tasks with no `group`, or whose group has no entry here, are only limited by `concurrency`. Change a limit at runtime with `.setGroupConcurrency()`.\n\n\t@default {}\n\n\t@example\n\t```\n\timport PQueue from 'p-queue';\n\n\tconst queue = new PQueue({groupConcurrency: {slowApi: 1}});\n\n\t// Both tagged with the same group, so only one runs at a time, whatever `concurrency` is.\n\tqueue.add(() => fetchFromSlowApi(), {group: 'slowApi'});\n\tqueue.add(() => fetchFromSlowApi(), {group: 'slowApi'});\n\t```\n\t*/\n\treadonly groupConcurrency?: Record<string, number> | undefined;\n} & TimeoutOptions;"
  test/basic.ts:
  - old: "\tassert.deepEqual(started, ['first']);\n\tassert.equal(queue.size, 1);\n\tqueue.clear();\n});\n"
    new: "\tassert.deepEqual(started, ['first']);\n\tassert.equal(queue.size, 1);\n\tqueue.clear();\n});\n\ntest('groupConcurrency limits tasks sharing a `group`, independently of `concurrency`', async () => {\n\tconst queue = new PQueue({concurrency: 10, groupConcurrency: {slow: 1}});\n\n\tlet activeInGroup = 0;\n\tlet maxActiveInGroup = 0;\n\n\tconst task = async () => {\n\t\tactiveInGroup++;\n\t\tmaxActiveInGroup = Math.max(maxActiveInGroup, activeInGroup);\n\t\tawait delay(20);\n\t\tactiveInGroup--;\n\t};\n\n\tawait Promise.all([\n\t\tqueue.add(task, {group: 'slow'}),\n\t\tqueue.add(task, {group: 'slow'}),\n\t\tqueue.add(task, {group: 'slow'}),\n\t]);\n\n\tassert.equal(maxActiveInGroup, 1);\n});\n\ntest('groupConcurrency does not limit tasks with no `group`, and different groups run independently', async () => {\n\tconst queue = new PQueue({concurrency: 10, groupConcurrency: {a: 1, b: 1}});\n\n\tlet ungatedRanWhileGroupRunning = false;\n\tlet sawBothGroupsActiveAtOnce = false;\n\tlet aActive = 0;\n\tlet bActive = 0;\n\n\tconst groupTask = (group: 'a' | 'b') => async () => {\n\t\tif (group === 'a') {\n\t\t\taActive++;\n\t\t} else {\n\t\t\tbActive++;\n\t\t}\n\n\t\tif (aActive > 0 && bActive > 0) {\n\t\t\tsawBothGroupsActiveAtOnce = true;\n\t\t}\n\n\t\tawait delay(15);\n\n\t\tif (group === 'a') {\n\t\t\taActive--;\n\t\t} else {\n\t\t\tbActive--;\n\t\t}\n\t};\n\n\tconst a = queue.add(groupTask('a'), {group: 'a'});\n\tawait delay(5);\n\tawait queue.add(async () => {\n\t\tungatedRanWhileGroupRunning = aActive > 0;\n\t});\n\tawait a;\n\n\tawait Promise.all([\n\t\tqueue.add(groupTask('a'), {group: 'a'}),\n\t\tqueue.add(groupTask('b'), {group: 'b'}),\n\t]);\n\n\tassert.equal(ungatedRanWhileGroupRunning, true);\n\tassert.equal(sawBothGroupsActiveAtOnce, true);\n});\n"
