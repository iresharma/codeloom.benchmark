      def test_cache_stale_after_remove_from_another_table_handle():
          """A second Table instance over the same storage+name must not keep
          serving a removed document from its own query cache.

          This is a regression test for a stale-cache bug: two ``Table`` objects
          (or two ``TinyDB`` instances) pointing at the same underlying storage
          and table name each keep their own query cache. Removing a document
          through one handle must still be visible to a cached query re-run on
          the other handle.
          """
          from tinydb.table import Table
          from tinydb.storages import MemoryStorage

          storage = MemoryStorage()
          t1 = Table(storage, 'shared')
          t2 = Table(storage, 'shared')

          t1.insert({'a': 1})
          t1.insert({'a': 2})

          q = where('a') == 2

          # Populate t2's cache
          assert t2.search(q) == [{'a': 2}]

          # Remove the matching document through the *other* handle
          t1.remove(where('a') == 2)

          # t2's cached result for `q` must no longer be trusted
          assert t2.search(q) == []
          assert len(t2) == 1


      def test_cache_stats_tracks_hits_and_misses():
          from tinydb import TinyDB
          from tinydb.storages import MemoryStorage

          db = TinyDB(storage=MemoryStorage)
          table = db.table('stats_test')
          table.insert({'a': 1})
          table.insert({'a': 2})

          stats = table.cache_stats()
          assert stats['hits'] == 0
          assert stats['misses'] == 0

          q = where('a') == 2
          table.search(q)  # miss
          table.search(q)  # hit
          table.search(q)  # hit

          stats = table.cache_stats()
          assert stats['hits'] == 2
          assert stats['misses'] == 1

          q2 = where('a') == 1
          table.search(q2)  # miss

          stats = table.cache_stats()
          assert stats['hits'] == 2
          assert stats['misses'] == 2


      def test_cache_stats_miss_after_remove():
          from tinydb import TinyDB
          from tinydb.storages import MemoryStorage

          db = TinyDB(storage=MemoryStorage)
          table = db.table('stats_test2')
          table.insert({'a': 1})
          table.insert({'a': 2})

          q = where('a') == 2
          table.search(q)  # miss
          table.search(q)  # hit

          table.remove(where('a') == 2)

          table.search(q)  # miss again: cache was invalidated by the removal
          stats = table.cache_stats()
          assert stats['misses'] == 2
          assert stats['hits'] == 1
