          def clear_cache(self) -> None:
              """
              Clear the query cache.
              """

              self._query_cache.clear()

              # The cache is now empty, so it's trivially in sync with nothing.
              # Forcing the next ``search()`` to recompute the fingerprint (rather
              # than assuming it's still valid) keeps this cheap and correct.
              self._cache_fingerprint = None

          def cache_stats(self) -> dict[str, int]:
              """
              Get statistics about this table's query cache.

              :returns: a dict with (at least) the keys ``hits`` (the number of
                        ``search()`` calls served from the query cache) and
                        ``misses`` (the number of ``search()`` calls that had to
                        recompute their results)
              """

              return {
                  'hits': self._cache_hits,
                  'misses': self._cache_misses,
                  'size': len(self._query_cache),
              }

          def _table_fingerprint(self, raw_table: Mapping) -> tuple:
              """
              Compute a cheap fingerprint of a table's current document-ID set.

              This intentionally only looks at the set of IDs (not document
              contents) so it stays cheap to compute. It's enough to detect
              insertions/removals, which is exactly the kind of out-of-band
              change that can otherwise leave a stale query cache around -- see
              :meth:`_sync_cache_fingerprint`.
              """

              return (len(raw_table), frozenset(raw_table.keys()))

          def _sync_cache_fingerprint(self) -> None:
              """
              Make sure the query cache reflects the current state of storage.

              Normally this table's own writes always go through
              :meth:`_update_table`, which already clears the cache. But if a
              *different* ``Table``/``TinyDB`` instance writes to the same
              underlying storage and table name (for example two ``TinyDB``
              instances opened on the same file, or two ``Table`` objects
              constructed directly on the same storage), this instance's own
              ``clear_cache`` is never called, and its query cache would
              otherwise keep returning stale results (e.g. a document that was
              removed through the other instance) forever. Comparing the current
              document-ID fingerprint against the one we last saw lets us detect
              that case and discard the now-untrustworthy cache.

              Note: this deliberately reads directly from ``self._storage``
              rather than going through :meth:`_read_table` (which also builds
              the ID-converted copy used for the actual search/filtering), so
              that a cache *hit* still costs only this cheap fingerprint check
              rather than a full table read/convert.
              """

              tables = self._storage.read()
              raw_table = {} if tables is None else tables.get(self.name, {})
              fingerprint = self._table_fingerprint(raw_table)

              if fingerprint != self._cache_fingerprint:
                  self._query_cache.clear()
                  self._cache_fingerprint = fingerprint

          def __len__(self):
