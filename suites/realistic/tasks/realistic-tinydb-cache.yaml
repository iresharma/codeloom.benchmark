title: Fix cross-handle stale query-cache reads and add cache_stats()
prompt: 'TinyDB''s per-table LRU query cache can return stale results: when two `Table` (or `TinyDB`) instances are opened on the same underlying storage and table name, each keeps its own private query cache, so deleting a document through one handle via `Table.remove(cond)` and then re-running a previously-cached query on a *different* handle for the same table can still return the stale cached result (and the same applies in reverse: a newly inserted, now-matching document can stay invisible to a handle that had already cached an empty result for that query). Reproduce this bug first against the pinned commit, then fix the underlying cache-invalidation logic so every `search()` call detects out-of-band changes to the table''s storage and discards a now-stale cache before serving a result. Also add `Table.cache_stats()` returning a dict with at least `hits` and `misses` counters that accurately reflect query-cache hit/miss behavior across inserts, removes and invalidation. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
