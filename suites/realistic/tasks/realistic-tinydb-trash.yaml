title: Add soft-delete (trash/restore) support to TinyDB tables
prompt: 'Add soft-delete support to TinyDB. Implement `Table.trash(doc_ids)` so it moves the given documents into a hidden trash table instead of permanently deleting them: trashed documents must no longer appear in normal queries, iteration, `len(table)`, `get()`, `search()` or `contains()`. Add `Table.restore(doc_ids)` to move documents back out of the trash table into the table, preserving their original doc_ids and content. Add `Table.purge_trash()` to permanently empty the trash table. Document IDs that don''t refer to an existing document should be silently skipped by `trash()`/`restore()`, with the return value reflecting only the IDs actually affected. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
