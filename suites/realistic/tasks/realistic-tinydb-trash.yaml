          db = TinyDB(path)
          assert 't' not in db._tables
          table = db.table('t', persist_empty=True)
          assert len(table) == 1
          assert table.all() == [{'a': 1}]
          db.close()


      def test_trash_hides_documents(db):
          table = db.table('trash_test')
          id1 = table.insert({'a': 1})
          id2 = table.insert({'a': 2})

          trashed = table.trash([id1])

          assert trashed == [id1]
          assert len(table) == 1
          assert table.all() == [table.document_class({'a': 2}, id2)]
          assert table.get(doc_id=id1) is None
          assert table.contains(doc_id=id1) is False
          assert [doc.doc_id for doc in table] == [id2]


      def test_trash_unknown_id_is_skipped(db):
          table = db.table('trash_test2')
          table.insert({'a': 1})

          assert table.trash([999]) == []
          assert len(table) == 1


      def test_restore_brings_document_back(db):
          table = db.table('trash_test3')
          id1 = table.insert({'a': 1})
          table.insert({'a': 2})

          table.trash([id1])
          assert len(table) == 1

          restored = table.restore([id1])

          assert restored == [id1]
          assert len(table) == 2
          doc = table.get(doc_id=id1)
          assert doc == {'a': 1}
          assert doc.doc_id == id1


      def test_purge_trash_empties_trash(db):
          table = db.table('trash_test4')
          id1 = table.insert({'a': 1})

          table.trash([id1])
          assert table.trashed() != []

          table.purge_trash()

          assert table.trashed() == []
          assert table.restore([id1]) == []
          assert len(table) == 0
