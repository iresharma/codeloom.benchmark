          def trash(self, doc_ids: Iterable[int]) -> list[int]:
              """
              Soft-delete the given documents by moving them into this table's
              hidden trash table instead of permanently removing them.

              Trashed documents no longer appear in normal queries, iteration,
              ``len()`` or ``get``/``search``/``contains``. Their original IDs and
              content are preserved so they can later be brought back with
              :meth:`restore`.

              Document IDs that don't refer to an existing document in this table
              are silently skipped, and the returned list only contains the IDs
              that were actually trashed.

              :param doc_ids: the document IDs to trash
              :returns: a list containing the IDs of the documents that were
                        trashed
              """
              requested_ids = list(doc_ids)
              trashed_ids: list[int] = []
              trashed_docs: dict[int, Mapping] = {}

              def updater(table: dict):
                  for doc_id in requested_ids:
                      if doc_id in table:
                          trashed_docs[doc_id] = table.pop(doc_id)
                          trashed_ids.append(doc_id)

              self._update_table(updater)

              if trashed_docs:
                  def trash_updater(trash_table: dict):
                      trash_table.update(trashed_docs)

                  self._update_trash_table(trash_updater)

              return trashed_ids

          def restore(self, doc_ids: Iterable[int]) -> list[int]:
              """
              Move the given documents out of this table's trash table and back
              into the table, preserving their original document IDs and content.

              Document IDs that don't refer to an existing document in the trash
              table are silently skipped, and the returned list only contains the
              IDs that were actually restored.

              :param doc_ids: the document IDs to restore
              :returns: a list containing the IDs of the documents that were
                        restored
              """
              requested_ids = list(doc_ids)
              restored_ids: list[int] = []
              restored_docs: dict[int, Mapping] = {}

              def trash_updater(trash_table: dict):
                  for doc_id in requested_ids:
                      if doc_id in trash_table:
                          restored_docs[doc_id] = trash_table.pop(doc_id)
                          restored_ids.append(doc_id)

              self._update_trash_table(trash_updater)

              if restored_docs:
                  def updater(table: dict):
                      table.update(restored_docs)

                  self._update_table(updater)

              return restored_ids

          def purge_trash(self) -> None:
              """
              Permanently remove all documents currently held in this table's
              trash table. **CANNOT BE REVERSED!**
              """

              self._update_trash_table(lambda trash_table: trash_table.clear())

          def trashed(self) -> list[Document]:
              """
              Get all documents currently held in this table's trash table.

              :returns: a list with all trashed documents.
              """

              return [
                  self.document_class(doc, self.document_id_class(doc_id))
                  for doc_id, doc in self._read_trash_table().items()
              ]

          def truncate(self) -> None:
  - old: |2-
              # Clear the query cache, as the table contents have changed
              self.clear_cache()
    new: |2-
              # Clear the query cache, as the table contents have changed
              self.clear_cache()

          @property
          def _trash_name(self) -> str:
              """
              The (hidden) name of the table used to hold this table's trashed
              (soft-deleted) documents.
              """

              return self.trash_table_prefix + self._name

          def _read_trash_table(self) -> dict[str, Mapping]:
              """
              Read this table's trash table data from the underlying storage.

              See :meth:`_read_table` for details; this behaves identically but
              operates on the hidden trash table instead.
              """

              tables = self._storage.read()

              if tables is None:
                  # The database is empty
                  return {}

              try:
                  table = tables[self._trash_name]
              except KeyError:
                  # The trash table does not exist yet, so it is empty
                  return {}

              return table

          def _update_trash_table(self, updater: Callable[[dict[int, Mapping]], None]):
              """
              Perform an update operation on this table's trash table.

              See :meth:`_update_table` for details; this behaves identically but
              operates on the hidden trash table instead. Note that updating the
              trash table does not clear this table's query cache, since it never
              contains trashed documents.
              """

              tables = self._storage.read()

              if tables is None:
                  # The database is empty
                  tables = {}

              try:
                  raw_table = tables[self._trash_name]
              except KeyError:
                  # The trash table does not exist yet, so it is empty
                  raw_table = {}

              table = {
                  self.document_id_class(doc_id): doc
                  for doc_id, doc in raw_table.items()
              }

              updater(table)

              tables[self._trash_name] = {
                  str(doc_id): doc
                  for doc_id, doc in table.items()
              }

              self._storage.write(tables)
