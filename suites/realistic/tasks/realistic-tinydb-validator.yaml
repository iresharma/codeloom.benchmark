    new: |-
      def test_caching_rejects_use_after_close(tmpdir):
          path = str(tmpdir.join('closed.db'))
          db = TinyDB(path, storage=CachingMiddleware(JSONStorage))
          db.insert({'key': 'value'})
          db.close()

          with pytest.raises(ValueError, match='closed'):
              db.insert({'key': 'again'})

          with pytest.raises(ValueError, match='closed'):
              db.all()

          with TinyDB(path, storage=CachingMiddleware(JSONStorage)) as reopened:
              assert reopened.all() == [{'key': 'value'}]


      def test_validator_runs_before_entering_write_cache():
          from tinydb.table import ValidationError

          def only_positive(doc):
              return doc.get('n', 0) > 0

          db = TinyDB(storage=CachingMiddleware(MemoryStorage))
          table = db.table('validated', validator=only_positive)

          # Bump the write cache size so the invalid write would otherwise sit
          # unflushed in the cache -- if validation ran only on flush, this
          # invalid document would still be accepted here.
          db.storage.WRITE_CACHE_SIZE = 1000

          table.insert({'n': 1})

          with pytest.raises(ValidationError):
              table.insert({'n': -1})

          # The invalid document must never have made it into the cache at all
          assert len(table) == 1
          assert table.all() == [{'n': 1}]

          db.close()
