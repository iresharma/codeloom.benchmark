          def set_validator(
              self,
              validator: Optional[Callable[[Mapping], Optional[bool]]]
          ) -> None:
              """
              Set (or clear, with ``None``) this table's document validator.

              The validator is called with each document that is about to be
              inserted or updated. Returning ``False`` or raising an exception
              aborts the write and raises :class:`~tinydb.table.ValidationError`.

              :param validator: the validator callable, or ``None`` to disable
                                 validation
              """
              self._validator = validator

          def _validate_document(self, document: Mapping) -> None:
              """
              Run this table's validator (if any) against ``document``.

              :raises ValidationError: if the validator returns ``False`` or
                                        raises an exception
              """
              if self._validator is None:
                  return

              try:
                  result = self._validator(document)
              except ValidationError:
                  raise
              except Exception as exc:
                  raise ValidationError(
                      f'Validator raised an exception for document '
                      f'{document!r}: {exc}'
                  ) from exc

              if result is False:
                  raise ValidationError(
                      f'Document failed validation: {document!r}'
                  )
