title: Add an optional per-table document validator to TinyDB
prompt: 'Add an optional per-table schema validator to TinyDB. `TinyDB.table(name, validator=fn)` (which forwards to `Table.__init__`) and a new `Table.set_validator(fn)` method should let callers install a callable that is run against every document before `insert`, `insert_multiple` and `update`. If the validator returns `False` or raises an exception, the write must be aborted (nothing persisted, including the rest of an `insert_multiple` batch) and a new `tinydb.table.ValidationError` must be raised with a useful message; an exception raised by the validator itself should be wrapped into `ValidationError` rather than propagating raw. This must also apply correctly when the table''s storage uses `CachingMiddleware`: validation must happen before a document enters the write cache, not only on flush, so an invalid document is rejected immediately even if the cache has not been flushed yet. Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree.'
