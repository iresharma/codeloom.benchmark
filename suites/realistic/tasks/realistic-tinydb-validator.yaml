      def test_validator_blocks_bad_insert(db):
          from tinydb.table import ValidationError

          def only_positive(doc):
              return doc.get('n', 0) > 0

          table = db.table('validated', validator=only_positive)
          table.insert({'n': 5})
          assert len(table) == 1

          with pytest.raises(ValidationError):
              table.insert({'n': -1})

          # The failed insert must not have been persisted
          assert len(table) == 1


      def test_validator_blocks_bad_insert_multiple(db):
          from tinydb.table import ValidationError

          def only_positive(doc):
              return doc.get('n', 0) > 0

          table = db.table('validated_multi', validator=only_positive)

          with pytest.raises(ValidationError):
              table.insert_multiple([{'n': 1}, {'n': -1}, {'n': 2}])

          # Atomic: none of the batch should have been written
          assert len(table) == 0


      def test_validator_blocks_bad_update(db):
          from tinydb.table import ValidationError

          def only_positive(doc):
              return doc.get('n', 0) > 0

          table = db.table('validated_update', validator=only_positive)
          doc_id = table.insert({'n': 1})

          with pytest.raises(ValidationError):
              table.update({'n': -5}, doc_ids=[doc_id])

          # Update must have been aborted, original document unchanged
          assert table.get(doc_id=doc_id) == {'n': 1}


      def test_validator_raising_is_wrapped(db):
          from tinydb.table import ValidationError

          def picky(doc):
              if 'name' not in doc:
                  raise KeyError('name')
              return True

          table = db.table('validated_raise', validator=picky)

          with pytest.raises(ValidationError):
              table.insert({'n': 1})

          assert len(table) == 0


      def test_set_validator_at_runtime(db):
          from tinydb.table import ValidationError

          table = db.table('validated_runtime')
          table.insert({'n': -1})  # no validator yet, should succeed

          table.set_validator(lambda doc: doc.get('n', 0) > 0)

          with pytest.raises(ValidationError):
              table.insert({'n': -2})

          table.set_validator(None)
          table.insert({'n': -3})  # validator cleared, should succeed again
          assert len(table) == 2
