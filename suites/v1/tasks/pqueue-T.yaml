id: pqueue-T
repo: pqueue
upstream: https://github.com/sindresorhus/p-queue.git
commit: 7f272ab5ff2254c0dc2537b7977e88ede1cd55e8
category: test-generation
language: typescript
title: Test settled queue batches
prompt: 'The supplied PQueue.settleAll(tasks) schedules every callback through this queue and returns
  all settled outcomes in input order, preserving rejection reasons. Empty batches resolve to []; concurrency
  and completion counters remain correct. Test this supplied feature, including rejection and deterministic
  concurrency cases.


  Work autonomously. Leave the final output on the main task checkout, not only a branch/worktree. Only
  add tests under benchmark_tests/. Do not edit production code, existing tests or test/config files.
  The supplied feature implementation has its reference tests withheld; unrelated upstream tests remain
  intact. Use node:test.'
allowed_paths:
- test/*.ts
- benchmark_tests/*
verification:
- npm run build
- node --import=tsx/esm --test --test-timeout=60000 test/*.ts
provenance: new_feature_tests_withheld
setup:
  test/strict.ts:
  - old: test('strict mode multiple complete intervals', async () => {
    new: "test('strict mode multiple complete intervals', async t => {\n\tt.mock.timers.enable({apis: ['setTimeout',\
      \ 'setInterval', 'Date'], now: 1_000_000});"
    count: 1
  - old: "\tawait queue.onIdle();\n\n\tassert.equal(executionTimes.length, 12);"
    new: "\tawait flush();\n\tassert.equal(executionTimes.length, 3);\n\n\t// Advance to each boundary,\
      \ proving no task starts before its slot.\n\tfor (let window = 0; window < 3; window++) {\n\t\tawait\
      \ tick(t, 99);\n\t\tassert.equal(executionTimes.length, (window + 1) * 3);\n\t\tawait tick(t, 1);\n\
      \t\tassert.equal(executionTimes.length, (window + 2) * 3);\n\t}\n\n\tawait queue.onIdle();\n\n\tassert.equal(executionTimes.length,\
      \ 12);"
    count: 1
  source/index.ts:
  - old: "\tsetPriority(id: string, priority: number) {"
    new: "\tasync settleAll<Result>(tasks: ReadonlyArray<() => Promise<Result>>): Promise<Array<PromiseSettledResult<Result>>>\
      \ {\n\t\treturn Promise.allSettled(tasks.map(task => this.add(task))) as Promise<Array<PromiseSettledResult<Result>>>;\n\
      \t}\n\n\tsetPriority(id: string, priority: number) {"
    count: 1
reference:
  benchmark_tests/settle.test.ts: "import test from 'node:test';import assert from 'node:assert/strict';import\
    \ PQueue from '../source/index.ts';\ntest('settleAll honors scheduling, order, failures and empty\
    \ arrays',async()=>{\n const q=new PQueue({concurrency:1});let live=0;let peak=0;const reason=new\
    \ Error('expected');\n const work=(value:number)=>async()=>{live++;peak=Math.max(peak,live);await\
    \ Promise.resolve();live--;return value;};\n const result=await q.settleAll([work(1),async()=>{throw\
    \ reason;},work(3)]);\n assert.equal(peak,1);assert.deepEqual(result,[{status:'fulfilled',value:1},{status:'rejected',reason},{status:'fulfilled',value:3}]);\n\
    \ assert.deepEqual(await q.settleAll([]),[]);assert.equal(q.pending,0);assert.equal(q.size,0);\n});\n"
mutants:
- source/index.ts:
  - old: tasks.map(task => this.add(task))
    new: tasks.map(task => task())
    count: 1
- source/index.ts:
  - old: Promise.allSettled(tasks.map(task => this.add(task)))
    new: Promise.all(tasks.map(task => this.add(task)))
    count: 1
- source/index.ts:
  - old: tasks.map(task => this.add(task))
    new: '[...tasks].reverse().map(task => this.add(task))'
    count: 1
- source/index.ts:
  - old: tasks.map(task => this.add(task))
    new: tasks.map(task => this.add(task).catch(() => undefined))
    count: 1
- source/index.ts:
  - old: tasks.map(task => this.add(task))
    new: tasks.slice(0, -1).map(task => this.add(task))
    count: 1
certification:
  status: pending
  reason: Reference/no-op, regression and mutant checks have not run.
