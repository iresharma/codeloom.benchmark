  - old: "\tsetPriority(id: string, priority: number) {"
    new: "\tsetPriorities(updates: ReadonlyArray<{id: string; priority: number}>): void {\n\t\tfor (const\
      \ {id, priority} of updates) {\n\t\t\tif (!Number.isFinite(priority)) { throw new TypeError('priority\
      \ must be finite'); }\n\t\t\tif (![...this.#waitingTasks].some(task => task.id === id)) { throw\
      \ new ReferenceError('unknown queued id'); }\n\t\t}\n\t\tif (this.#queue.setPriorities) { this.#queue.setPriorities(updates);\
      \ }\n\t\telse { for (const {id, priority} of updates) { this.#queue.setPriority(id, priority); }\
      \ }\n\t\tfor (const {id, priority} of updates) {\n\t\t\tfor (const task of this.#waitingTasks) {\
      \ if (task.id === id) { task.priority = priority; } }\n\t\t}\n\t}\n\n\tsetPriority(id: string, priority:\
      \ number) {"
