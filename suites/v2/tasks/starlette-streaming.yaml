id: starlette-streaming
repo: starlette
upstream: https://github.com/Kludex/starlette.git
commit: cb8f84f5284dc301ca7a31eb732b9e140769dd48
title: Repair streaming and background lifecycle
prompt: 'Repair streaming disconnect cancellation and BackgroundTasks ordering. Disconnects must terminate
  streaming rather than leave the producer running; normal completion must await every registered background
  task in registration order. Preserve sync/async task support.


  Work autonomously in the main task checkout. Production source, documentation and new benchmark_tests/
  tests may change within allowed paths; existing upstream tests, dependency/configuration files and .bench/
  are immutable. Leave the final patch on this checkout.'
category: bug
language: python
provenance: fabricated-regression
allowed_paths:
- starlette/*.py
- docs/*
- benchmark_tests/*
setup:
  starlette/responses.py:
  - old: task_group.cancel_scope.cancel()
    new: await anyio.sleep(3600)
  starlette/background.py:
  - old: 'for task in self.tasks:'
    new: 'for task in self.tasks[:1]:'
reference:
  starlette/responses.py:
  - old: await anyio.sleep(3600)
    new: task_group.cancel_scope.cancel()
  starlette/background.py:
  - old: 'for task in self.tasks[:1]:'
    new: 'for task in self.tasks:'
mutants: []
verification:
- python -m pytest -o addopts= -q tests/test_background.py
runtime:
  cpus: 2
  memory_gb: 3
evidence: {}
grader:
  command: python -m pytest -o addopts= -q /tmp/oracle/check.py
